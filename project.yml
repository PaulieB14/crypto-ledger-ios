name: CryptoLedger

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  LedgerCore:
    path: LedgerCore

targets:
  CryptoLedger:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: LedgerCore
        product: LedgerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paulbarba.cryptoledger
        DEVELOPMENT_TEAM: 3G88YKSHG7
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Argus
        # Only standard HTTPS — declares no non-exempt encryption so TestFlight
        # doesn't block each build on the export-compliance question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Supported orientations (iPad multitasking requires all four declared).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        # No signing needed for the simulator. Set your team before running on
        # a physical device.
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  CryptoLedger:
    build:
      targets:
        CryptoLedger: all
    run:
      config: Debug
