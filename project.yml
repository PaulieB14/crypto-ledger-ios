name: CryptoLedger

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  LedgerCore:
    path: LedgerCore

targets:
  CryptoLedger:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: LedgerCore
        product: LedgerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cryptoledger
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        # No signing needed for the simulator. Set your team before running on
        # a physical device.
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  CryptoLedger:
    build:
      targets:
        CryptoLedger: all
    run:
      config: Debug
