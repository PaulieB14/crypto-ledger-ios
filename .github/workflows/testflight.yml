name: TestFlight

# Archives the app, signs it with your App Store Connect API key (automatic
# cloud signing — no local certs), and uploads to TestFlight. Run manually from
# the Actions tab (or `gh workflow run testflight.yml`). Each run gets a unique
# build number from the run counter, which TestFlight requires.

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-latest
    env:
      PROJECT: CryptoLedger.xcodeproj
      SCHEME: CryptoLedger
      TEAM_ID: "3G88YKSHG7"
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install API key
        env:
          KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          printf '%s' "$KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive (unsigned — signed at export)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION=1.0 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            COINGECKO_API_KEY="${{ secrets.COINGECKO_API_KEY }}"
          # Fail loudly rather than shipping a build that will quietly share the
          # anonymous per-IP rate limit — that is what makes prices vanish for
          # reviewers and users on busy networks.
          if [ -z "${{ secrets.COINGECKO_API_KEY }}" ]; then
            echo "::warning::COINGECKO_API_KEY secret is not set — this build makes keyless CoinGecko requests and will be rate-limited on shared networks."
          fi

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST
          # Automatic signing calls Apple's provisioning API at export time,
          # which intermittently returns 504s. Retry so a transient Apple blip
          # doesn't fail an otherwise-good build.
          attempt=1; max=4
          while true; do
            echo "::group::Export attempt $attempt/$max"
            rm -rf "$RUNNER_TEMP/export"
            if xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              -exportPath "$RUNNER_TEMP/export" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
              -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
              -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}"; then
              echo "::endgroup::"; echo "Export succeeded on attempt $attempt"; break
            fi
            echo "::endgroup::"
            if [ $attempt -ge $max ]; then
              echo "Export failed after $max attempts (Apple provisioning API unavailable)."; exit 1
            fi
            attempt=$((attempt+1))
            echo "Transient export failure; retrying in 60s…"
            sleep 60
          done

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app -t ios \
            -f "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "${{ secrets.APPSTORE_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}"
